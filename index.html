<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Luxury Accessories</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        beige: '#F9F6F0',
                        blush: '#FDECEF',
                        gray: { light: '#E5E7EB', text: '#6B7280' },
                        gold: { DEFAULT: '#C5A059', bright: '#D4AF37' }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Liquid UI & Glassmorphism Styles -->
    <style>
        body {
            background-color: #F9F6F0; /* Creamy beige */
            overflow-x: hidden;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(197, 160, 89, 0.05);
        }
        
        .glass-header {
            background: linear-gradient(180deg, rgba(249, 246, 240, 0.9) 0%, rgba(249, 246, 240, 0.4) 100%);
            backdrop-filter: blur(8px);
        }

        /* Liquid Button Animation */
        .btn-liquid {
            background: linear-gradient(45deg, #C5A059, #D4AF37, #E5C175, #C5A059);
            background-size: 300% 300%;
            animation: flowing-gradient 4s ease infinite;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            border-radius: 50px;
        }
        .btn-liquid:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(197, 160, 89, 0.4);
        }

        @keyframes flowing-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Water Reflection Hover Effect on Cards */
        .product-card {
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
            position: relative;
        }
        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            z-index: 2;
            transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }
        .product-card:hover::before {
            left: 200%;
        }

        /* Image smooth scaling */
        .product-img {
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .product-card:hover .product-img {
            transform: scale(1.05);
        }

        /* Slow Motion Liquid Video Overlay */
        .video-container {
            position: relative;
            height: 90vh;
            overflow: hidden;
        }
        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(253, 236, 239, 0.4) 0%, rgba(249, 246, 240, 0.6) 100%); /* Soft blush to beige */
            z-index: 1;
        }
        video {
            object-fit: cover;
            width: 100%;
            height: 100%;
            filter: contrast(0.9) brightness(1.1);
        }
        
        .hero-content {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F9F6F0; }
        ::-webkit-scrollbar-thumb { background: #E5E7EB; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #C5A059; }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased relative">

    <!-- Sticky Glass Header -->
    <header class="fixed w-full top-0 z-50 glass-header border-b border-white/40 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="font-serif text-3xl font-semibold tracking-wider text-gray-800">AURA</h1>
            <nav class="hidden md:flex space-x-8 text-sm font-medium tracking-wide">
                <a href="#" class="text-gray-800 hover:text-gold transition">COLLECTIONS</a>
                <a href="#" class="text-gray-800 hover:text-gold transition">NEW ARRIVALS</a>
                <a href="#" class="text-gray-800 hover:text-gold transition">ABOUT</a>
            </nav>
            <div class="flex space-x-4 items-center">
                <button id="adminToggle" class="text-xs font-semibold tracking-widest text-gray-500 hover:text-gold transition">ADMIN</button>
                <button class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center hover:border-gold hover:text-gold transition">
                    <!-- Simple Bag Icon -->
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section with Liquid Video -->
    <section class="video-container">
        <!-- Replace src with your own high-res flowing liquid/silk video -->
        <video autoplay loop muted playsinline>
            <source src="https://assets.mixkit.co/videos/preview/mixkit-ink-swirling-in-water-2365-large.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
        <div class="hero-content flex flex-col items-center">
            <h2 class="font-serif text-5xl md:text-7xl text-gray-800 mb-6 drop-shadow-sm font-medium">Fluid Elegance</h2>
            <p class="text-lg md:text-xl text-gray-700 font-light max-w-lg mb-8 tracking-wide">Discover our exclusively curated luxury accessories, designed to flow seamlessly with your lifestyle.</p>
            <button class="btn-liquid text-white px-10 py-4 font-semibold tracking-widest text-sm shadow-lg">EXPLORE COLLECTION</button>
        </div>
    </section>

    <!-- Dynamic Product Grid -->
    <main class="max-w-7xl mx-auto px-6 py-24">
        <div class="text-center mb-16">
            <span class="text-gold font-semibold tracking-widest text-xs uppercase">Curated Selection</span>
            <h3 class="font-serif text-3xl md:text-4xl mt-3 text-gray-800">The Signature Edit</h3>
        </div>

        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Products injected by Firebase/JS -->
            <div class="col-span-full text-center text-gray-500 py-10" id="loadingState">Loading exquisite pieces...</div>
        </div>
    </main>

    <!-- Admin Dashboard Modal (Glassmorphism) -->
    <div id="adminModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" id="adminCloseOverlay"></div>
        <div class="glass relative w-full max-w-lg rounded-2xl p-8 shadow-2xl border border-white/60">
            <button id="closeAdminBtn" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="font-serif text-2xl text-gray-800 mb-6 border-b border-gray-200 pb-2">Store Management</h3>
            
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="productId">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1 tracking-wide">PRODUCT NAME</label>
                    <input type="text" id="pName" required class="w-full bg-white/60 border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-gold transition">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1 tracking-wide">PRICE ($)</label>
                        <input type="number" id="pPrice" required class="w-full bg-white/60 border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-gold transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1 tracking-wide">ORIGINAL PRICE (Optional)</label>
                        <input type="number" id="pOriginalPrice" class="w-full bg-white/60 border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-gold transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1 tracking-wide">IMAGE URL</label>
                    <input type="url" id="pImage" required placeholder="https://..." class="w-full bg-white/60 border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:border-gold transition">
                </div>

                <button type="submit" class="w-full btn-liquid text-white py-3 mt-4 font-semibold tracking-widest text-sm shadow-lg">SAVE PRODUCT</button>
            </form>
            <div id="adminMsg" class="mt-4 text-center text-sm font-medium hidden"></div>
        </div>
    </div>

    <!-- Firebase & Application Logic -->
    <script type="module">
        // 1. Import Firebase ES Modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, deleteDoc } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. Firebase Configuration (REPLACE WITH YOUR ACTUAL FIREBASE CONFIG)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // UI Logic Setup
        const productGrid = document.getElementById('productGrid');
        const loadingState = document.getElementById('loadingState');
        const adminToggle = document.getElementById('adminToggle');
        const adminModal = document.getElementById('adminModal');
        const closeAdminBtn = document.getElementById('closeAdminBtn');
        const adminCloseOverlay = document.getElementById('adminCloseOverlay');
        const productForm = document.getElementById('productForm');
        
        // Form Fields
        const idField = document.getElementById('productId');
        const nameField = document.getElementById('pName');
        const priceField = document.getElementById('pPrice');
        const origPriceField = document.getElementById('pOriginalPrice');
        const imageField = document.getElementById('pImage');
        const adminMsg = document.getElementById('adminMsg');

        // Modal Toggles
        const toggleModal = () => adminModal.classList.toggle('hidden');
        adminToggle.addEventListener('click', () => { productForm.reset(); idField.value = ''; toggleModal(); });
        closeAdminBtn.addEventListener('click', toggleModal);
        adminCloseOverlay.addEventListener('click', toggleModal);

        // Render Function
        const renderProducts = (products) => {
            productGrid.innerHTML = ''; // Clear grid
            
            if(products.length === 0) {
                productGrid.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10 font-serif italic">No collections available currently.</div>`;
                return;
            }

            products.forEach(product => {
                const hasDiscount = product.originalPrice && product.originalPrice > product.price;
                const card = document.createElement('div');
                card.className = 'product-card glass p-4 flex flex-col group';
                
                card.innerHTML = `
                    <div class="relative w-full h-80 rounded-xl overflow-hidden bg-white/40 mb-4">
                        ${hasDiscount ? `<span class="absolute top-3 left-3 bg-blush text-gray-800 text-xs font-bold px-3 py-1 rounded-full z-10 tracking-wider">SALE</span>` : ''}
                        <img src="${product.image}" alt="${product.name}" class="product-img w-full h-full object-cover object-center">
                    </div>
                    <div class="flex-grow flex flex-col items-center text-center">
                        <h4 class="font-serif text-lg text-gray-800 mb-2 group-hover:text-gold transition">${product.name}</h4>
                        <div class="mt-auto flex items-center space-x-3">
                            <span class="text-gray-800 font-semibold">$${product.price}</span>
                            ${hasDiscount ? `<span class="text-gray-400 line-through text-sm">$${product.originalPrice}</span>` : ''}
                        </div>
                    </div>
                    <button class="w-full mt-4 py-2 border border-gold text-gold rounded-full font-semibold text-xs tracking-widest hover:bg-gold hover:text-white transition duration-300" onclick="window.editProduct('${product.id}', '${product.name.replace(/'/g, "\\'")}', ${product.price}, ${product.originalPrice || "''"}, '${product.image}')">
                        QUICK EDIT
                    </button>
                `;
                productGrid.appendChild(card);
            });
        };

        // Fallback Mock Data if Firebase isn't configured yet
        if (firebaseConfig.apiKey === "YOUR_API_KEY") {
            const mockData = [
                { id: '1', name: 'Lumière Gold Watch', price: 450, originalPrice: null, image: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?q=80&w=1000&auto=format&fit=crop' },
                { id: '2', name: 'Blush Silk Scarf', price: 120, originalPrice: 160, image: 'https://images.unsplash.com/photo-1598532163257-ae3c6b2524b6?q=80&w=1000&auto=format&fit=crop' },
                { id: '3', name: 'Onyx Leather Tote', price: 890, originalPrice: null, image: 'https://images.unsplash.com/photo-1584916201218-f4242ceb4809?q=80&w=1000&auto=format&fit=crop' }
            ];
            loadingState.style.display = 'none';
            renderProducts(mockData);
            
            productForm.addEventListener('submit', (e) => {
                e.preventDefault();
                alert("Please configure your Firebase credentials in the HTML file to enable saving.");
            });
        } 
        else {
            // Actual Firebase Implementation
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const productsRef = collection(db, "products");

            // Real-time listener
            onSnapshot(productsRef, (snapshot) => {
                loadingState.style.display = 'none';
                const products = [];
                snapshot.forEach((doc) => products.push({ id: doc.id, ...doc.data() }));
                renderProducts(products);
            }, (error) => {
                console.error("Firebase Read Error:", error);
                loadingState.innerHTML = "Error loading database. Check console.";
            });

            // Handle Admin Form Submit
            productForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = idField.value;
                const data = {
                    name: nameField.value,
                    price: parseFloat(priceField.value),
                    originalPrice: origPriceField.value ? parseFloat(origPriceField.value) : null,
                    image: imageField.value,
                    updatedAt: new Date()
                };

                const btn = productForm.querySelector('button[type="submit"]');
                btn.innerText = "SAVING...";

                try {
                    if (id) {
                        await updateDoc(doc(db, "products", id), data);
                        showMessage("Product updated successfully!", "text-green-600");
                    } else {
                        await addDoc(productsRef, data);
                        showMessage("Product added successfully!", "text-green-600");
                    }
                    setTimeout(toggleModal, 1500);
                } catch (error) {
                    showMessage(error.message, "text-red-600");
                } finally {
                    btn.innerText = "SAVE PRODUCT";
                }
            });

            function showMessage(msg, colorClass) {
                adminMsg.textContent = msg;
                adminMsg.className = `mt-4 text-center text-sm font-medium block ${colorClass}`;
                setTimeout(() => adminMsg.classList.add('hidden'), 3000);
            }
        }

        // Expose edit function to global window so the inline onclick works
        window.editProduct = (id, name, price, originalPrice, image) => {
            idField.value = id;
            nameField.value = name;
            priceField.value = price;
            origPriceField.value = originalPrice || '';
            imageField.value = image;
            toggleModal();
        };

    </script>
</body>
</html>
