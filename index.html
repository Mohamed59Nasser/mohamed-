<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أوريليا — مجوهرات فاخرة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;600;700&display=swap');
    :root { --gold: #B08E4F; --gold-light: #D9C7A5; --dark: #1A1A1A; }
    body { font-family: 'Cairo', sans-serif; background-color: #FAFAFA; color: var(--dark); overflow-x: hidden; }
    h1, h2, h3, .font-display { font-family: 'Amiri', serif; }
    
    /* Custom Scrollbar & Utils */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--gold-light); border-radius: 4px; }
    .btn-gold { background: var(--gold); color: white; transition: 0.3s; }
    .btn-gold:hover { background: #8E6E32; }
    .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #E3D6BE; }
    
    /* Modals & Overlays */
    .sheet-hidden { opacity: 0; pointer-events: none; visibility: hidden; }
    .sheet-active { opacity: 1; pointer-events: auto; visibility: visible; }
    .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--gold); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="antialiased">

  <!-- Navbar -->
  <header class="fixed top-0 w-full z-50 glass-nav transition-all duration-300" id="navInner">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <button data-act="menu" class="lg:hidden text-2xl">☰</button>
        <a href="#/home" data-act="nav" data-view="home" class="text-2xl font-display font-bold text-[#B08E4F] tracking-wide">AURÉLIA</a>
      </div>
      <nav class="hidden lg:flex items-center gap-8 text-sm font-semibold">
        <a href="#/shop" data-act="nav" data-view="shop" class="hover:text-[#B08E4F] transition">المتجر</a>
        <a href="#/wishlist" data-act="nav" data-view="wishlist" class="hover:text-[#B08E4F] transition">المفضلة</a>
        <a href="#/about" data-act="nav" data-view="about" class="hover:text-[#B08E4F] transition">من نحن</a>
      </nav>
      <div class="flex items-center gap-4">
        <button data-act="lang" id="langLabel" class="text-xs font-bold uppercase hover:text-[#B08E4F]">EN</button>
        <button data-act="account" class="text-xl hover:text-[#B08E4F]">👤</button>
        <button data-act="cart" class="text-xl relative hover:text-[#B08E4F]">
          🛒 <span id="cartBadge" class="absolute -top-1 -right-2 bg-[#B08E4F] text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main App Container -->
  <main id="app" class="pt-16 min-h-screen"></main>

  <!-- Firebase & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 1. Firebase Configuration (Linked to your DB)
    const firebaseConfig = {
      databaseURL: "https://mohamed-a9564-default-rtdb.firebaseio.com/",
      // Note: Make sure to add your apiKey and projectId here from Firebase Console for Auth to work correctly.
      apiKey: "YOUR_API_KEY_HERE",
      projectId: "mohamed-a9564",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // 2. Global State & Dynamic Data
    window.PRODUCTS = []; // Will be populated from Firebase
    window.S = {
      view: 'home',
      cart: JSON.parse(localStorage.getItem("au_cart") || "[]"),
      wish: JSON.parse(localStorage.getItem("au_wish") || "[]"),
      user: null,
      profile: { addresses: [], orders: [] }
    };

    // 3. Realtime Listener for Products (Connects with Dashboard)
    function listenToProducts() {
      const productsRef = ref(db, 'products');
      onValue(productsRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          // Convert Firebase Object to Array
          window.PRODUCTS = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        } else {
          window.PRODUCTS = [];
        }
        if(S.view === 'shop' || S.view === 'home') render(); // Re-render UI live
      });
    }

    // 4. Core Render Engine
    window.render = function() {
      const appDiv = document.getElementById("app");
      
      if(S.view === 'home') {
        appDiv.innerHTML = `
          <section class="h-[80vh] flex flex-col items-center justify-center text-center px-4 bg-gradient-to-b from-[#F6EEDC] to-white">
            <h1 class="text-5xl md:text-7xl font-display text-[#B08E4F] mb-4">أناقة لا تفنى</h1>
            <p class="text-lg text-gray-600 max-w-lg mx-auto mb-8">اكتشف مجموعتنا الحصرية من المجوهرات الفاخرة المصممة لتعكس جمالك الداخلي.</p>
            <button data-act="nav" data-view="shop" class="btn-gold px-8 py-3 rounded-full text-lg font-bold shadow-lg">تسوق الآن</button>
          </section>
        `;
      } 
      else if (S.view === 'shop') {
        let productsHTML = window.PRODUCTS.length > 0 
          ? window.PRODUCTS.map(p => `
              <div class="bg-white p-4 rounded-xl shadow-sm border border-[#E3D6BE] hover:shadow-md transition">
                <img src="${p.img || 'https://via.placeholder.com/300'}" class="w-full h-48 object-cover rounded-lg mb-4">
                <h3 class="font-display text-xl font-bold">${p.nameAr || p.name}</h3>
                <p class="text-[#B08E4F] font-semibold mt-2">${p.price} EGP</p>
                <button data-act="add" data-pid="${p.id}" class="w-full mt-4 border border-[#B08E4F] text-[#B08E4F] py-2 rounded-lg hover:bg-[#B08E4F] hover:text-white transition">أضف للسلة</button>
              </div>
            `).join('')
          : `<div class="col-span-full text-center py-20"><div class="loader mx-auto mb-4"></div>جاري تحميل المنتجات من قاعدة البيانات...</div>`;

        appDiv.innerHTML = `
          <div class="max-w-7xl mx-auto px-4 py-12">
            <h2 class="text-3xl font-display text-center mb-10">المجموعة الكاملة</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
              ${productsHTML}
            </div>
          </div>
        `;
      }
      else if (S.view === 'profile') {
        appDiv.innerHTML = `
          <div class="max-w-3xl mx-auto px-4 py-12 text-center">
            <h2 class="text-3xl font-display mb-4">مرحباً، ${S.user ? S.user.displayName : 'زائر'}</h2>
            ${S.user 
              ? `<button data-act="signout" class="btn-gold px-6 py-2 rounded-lg mt-4">تسجيل الخروج</button>` 
              : `<button data-act="account" class="btn-gold px-6 py-2 rounded-lg mt-4">تسجيل الدخول باستخدام جوجل</button>`}
          </div>
        `;
      }
    };

    // 5. Auth & Event Delegation
    document.addEventListener("click", async (e) => {
      const el = e.target.closest("[data-act]");
      if (!el) return;
      const act = el.dataset.act;

      if (act === "nav") {
        S.view = el.dataset.view;
        window.location.hash = `/${S.view}`;
        render();
      }
      if (act === "add") {
        S.cart.push({ id: el.dataset.pid, q: 1 });
        localStorage.setItem("au_cart", JSON.stringify(S.cart));
        updateBadge();
        alert("تمت الإضافة للسلة بنجاح!");
      }
      if (act === "account") {
        if(!S.user) {
          try {
            const result = await signInWithPopup(auth, provider);
            S.user = result.user;
            S.view = 'profile';
            render();
          } catch(err) { console.error("Auth Error", err); }
        } else {
          S.view = 'profile';
          render();
        }
      }
      if (act === "signout") {
        await signOut(auth);
        S.user = null;
        S.view = 'home';
        render();
      }
    });

    function updateBadge() {
      const badge = document.getElementById("cartBadge");
      const total = S.cart.reduce((sum, item) => sum + item.q, 0);
      if(total > 0) { badge.textContent = total; badge.classList.remove("hidden"); }
      else { badge.classList.add("hidden"); }
    }

    // 6. Router & Initialization
    window.addEventListener("hashchange", () => {
      const hash = window.location.hash.replace("#/", "") || "home";
      S.view = hash;
      render();
    });

    onAuthStateChanged(auth, (user) => {
      if (user) S.user = user;
      render();
    });

    // Boot
    updateBadge();
    listenToProducts(); // Start listening to Firebase DB
    if(window.location.hash) {
      S.view = window.location.hash.replace("#/", "");
    }
    render();
  </script>
</body>
</html>
