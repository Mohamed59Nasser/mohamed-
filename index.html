<!--
  ============================================================================
  MARÉE — SETUP NOTES
  ============================================================================
  This file runs with zero build step: React, Firebase, and Tailwind are all
  loaded from CDNs, and JSX is compiled in-browser by Babel. Deploy it as-is
  to GitHub Pages, Netlify, or any static host — just upload this one file
  as index.html.

  CONNECTING YOUR OWN FIREBASE PROJECT
  1. Go to console.firebase.google.com and create a project.
  2. Build > Firestore Database > Create database (start in test mode, then
     tighten rules — see suggested rules below).
  3. Build > Authentication > Sign-in method > enable "Email/Password".
     Add yourself as a user under the Users tab — that's your admin login.
  4. Project settings > General > Your apps > Web app > copy the config
     object and paste it over FIREBASE_CONFIG below.
  5. That's it — the site will detect a real config and switch off demo mode
     automatically. Products you add in the Admin panel sync live to every
     visitor via onSnapshot.

  SUGGESTED FIRESTORE RULES (tighten before going live):
    rules_version = '2';
    service cloud.firestore {
      match /databases/{database}/documents {
        match /products/{productId} {
          allow read: if true;
          allow write: if request.auth != null;
        }
      }
    }

  DEMO MODE
  Until you paste real config values, the site runs on a local mock backend
  (browser localStorage standing in for Firestore, a fixed passphrase
  standing in for Firebase Auth). Everything — live product sync, the admin
  dashboard, CRUD — works exactly the same way, so you can preview the full
  experience before connecting a project. Demo admin passphrase: demo1234
  ============================================================================
-->

const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============================================================================
   FIREBASE CONFIG — replace with your project's config (see notes above)
============================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID",
};

const USE_MOCK = FIREBASE_CONFIG.apiKey === "YOUR_FIREBASE_API_KEY";
let fbApp, db, auth;
if (!USE_MOCK) {
  fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  auth = firebase.auth();
}

/* ============================================================================
   BACKEND ABSTRACTION — same API whether talking to Firestore or the
   localStorage mock, so the rest of the app never needs to know which.
============================================================================ */
const MOCK_KEY = "maree_products_v1";
const MOCK_AUTH_KEY = "maree_admin_authed_v1";
const MOCK_PASSPHRASE = "demo1234";

const SEED_PRODUCTS = [
  { id: "seed-1", name: "Tidal Drop Earrings", category: "Jewelry", price: 240, discountPrice: null, description: "Brushed gold drops that catch the light like sunlit water.", from: "#EFDAD2", to: "#D9BD8C", createdAt: 9 },

  { id: "seed-5", name: "Opaline Silk Scarf", category: "Scarves", price: 190, discountPrice: 150, description: "Hand-rolled silk, dyed in slow gradients of blush and cream.", from: "#F6EFE4", to: "#EFDAD2", createdAt: 5 },

  { id: "seed-7", name: "Gilded Wave Cuff", category: "Jewelry", price: 280, discountPrice: null, description: "A single fluid curve of brushed gold, worn alone.", from: "#D9BD8C", to: "#B8935A", createdAt: 3 },
  { id: "seed-8", name: "Ebb Tote", category: "Handbags", price: 540, discountPrice: null, description: "Soft structure, a strap that drapes like it's mid-motion.", from: "#EFDAD2", to: "#EAE7E1", createdAt: 2 },
];

function readMock() {
  try {
    const raw = localStorage.getItem(MOCK_KEY);
    if (!raw) {
      localStorage.setItem(MOCK_KEY, JSON.stringify(SEED_PRODUCTS));
      return SEED_PRODUCTS;
    }
    return JSON.parse(raw);
  } catch (e) { return SEED_PRODUCTS; }
}
function writeMock(products) {
  localStorage.setItem(MOCK_KEY, JSON.stringify(products));
  window.dispatchEvent(new CustomEvent("maree-mock-update"));
}

function subscribeProducts(cb) {
  if (USE_MOCK) {
    const handler = () => cb([...readMock()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
    handler();
    window.addEventListener("maree-mock-update", handler);
    window.addEventListener("storage", handler);
    return () => {
      window.removeEventListener("maree-mock-update", handler);
      window.removeEventListener("storage", handler);
    };
  }
  return db.collection("products").orderBy("createdAt", "desc").onSnapshot(
    (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
    (err) => console.error("Firestore subscribe error:", err)
  );
}

async function saveProduct(product) {
  if (USE_MOCK) {
    const products = readMock();
    if (product.id) {
      const idx = products.findIndex((p) => p.id === product.id);
      if (idx > -1) products[idx] = { ...products[idx], ...product };
    } else {
      products.unshift({ ...product, id: "p-" + Date.now(), createdAt: Date.now() });
    }
    writeMock(products);
    return;
  }
  const { id, ...data } = product;
  if (id) return db.collection("products").doc(id).set(data, { merge: true });
  return db.collection("products").add({ ...data, createdAt: Date.now() });
}

async function deleteProduct(id) {
  if (USE_MOCK) {
    writeMock(readMock().filter((p) => p.id !== id));
    return;
  }
  return db.collection("products").doc(id).delete();
}

function adminSignIn(email, pass) {
  if (USE_MOCK) {
    return new Promise((resolve, reject) => {
      if (pass === MOCK_PASSPHRASE) {
        localStorage.setItem(MOCK_AUTH_KEY, "1");
        window.dispatchEvent(new CustomEvent("maree-auth-change"));
        resolve();
      } else reject(new Error("That passphrase doesn't match. Try demo1234."));
    });
  }
  return auth.signInWithEmailAndPassword(email, pass);
}
function adminSignOut() {
  if (USE_MOCK) {
    localStorage.removeItem(MOCK_AUTH_KEY);
    window.dispatchEvent(new CustomEvent("maree-auth-change"));
    return;
  }
  return auth.signOut();
}
function onAdminAuthChange(cb) {
  if (USE_MOCK) {
    const handler = () => cb(localStorage.getItem(MOCK_AUTH_KEY) === "1");
    handler();
    window.addEventListener("maree-auth-change", handler);
    return () => window.removeEventListener("maree-auth-change", handler);
  }
  return auth.onAuthStateChanged((user) => cb(!!user));
}

/* ============================================================================
   SMALL UI HELPERS
============================================================================ */
function useMousePosition(ref) {
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onMove = (e) => {
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", ((e.clientX - r.left) / r.width) * 100 + "%");
      el.style.setProperty("--my", ((e.clientY - r.top) / r.height) * 100 + "%");
    };
    el.addEventListener("mousemove", onMove);
    return () => el.removeEventListener("mousemove", onMove);
  }, [ref]);
}

function WaveDivider({ flip = false, className = "" }) {
  return (
    <svg className={"wave-rule " + className} viewBox="0 0 1000 20" preserveAspectRatio="none" style={flip ? { transform: "scaleY(-1)" } : {}} aria-hidden="true">
      <path d="M0,10 C 150,0 350,20 500,10 C 650,0 850,20 1000,10 L1000,20 L0,20 Z" fill="currentColor" />
    </svg>
  );
}

function LiquidBlobField({ className = "" }) {

}

/* ============================================================================

============================================================================ */
function Header({ onOpenAdmin }) {

  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 24);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const links = ["Collection", "Categories", "The House", "Contact"];

  return (
    <header className={"fixed top-0 inset-x-0 z-40 transition-all duration-500 " + (scrolled ? "glass shadow-[0_8px_30px_-15px_rgba(58,52,46,0.25)]" : "bg-transparent border-b border-transparent")}>

          {links.map((l) => (
            <a key={l} href={"#" + l.toLowerCase().replace(/\s/g, "-")} className="text-sm tracking-wide text-ink-muted hover:text-ink transition-colors focus-ring rounded">{l}</a>
          ))}
        </nav>
        <div className="flex items-center gap-4">

            <Icon name="gear" className="w-5 h-5" />
          </button>
          <button aria-label="View cart" className="text-ink-muted hover:text-gold-deep transition-colors focus-ring rounded p-1">
            <Icon name="cart" className="w-5 h-5" />
          </button>
          <button className="md:hidden text-ink focus-ring rounded p-1" aria-label="Open menu" onClick={() => setMenuOpen((v) => !v)}>
            <Icon name={menuOpen ? "close" : "menu"} className="w-5 h-5" />
          </button>
        </div>
      </div>
      {menuOpen && (
        <div className="md:hidden glass border-t border-white/40 px-6 py-4 flex flex-col gap-4">
          {links.map((l) => (
            <a key={l} href={"#" + l.toLowerCase().replace(/\s/g, "-")} onClick={() => setMenuOpen(false)} className="text-sm text-ink-muted hover:text-ink">{l}</a>
          ))}
        </div>
      )}
    </header>
  );
}

          </p>
          <div className="mt-10 flex items-center gap-5">
            <a href="#collection" className="liquid-btn focus-ring inline-flex items-center gap-2 bg-gradient-to-br from-gold-light to-gold-deep text-porcelain px-8 py-4 rounded-full text-sm tracking-wide shadow-[0_10px_30px_-10px_rgba(143,110,63,0.6)] hover:shadow-[0_14px_40px_-10px_rgba(143,110,63,0.75)] transition-shadow">
              <span className="relative z-10">Explore the collection</span>
            </a>
            <a href="#categories" className="text-sm text-ink-muted hover:text-ink border-b border-ink-muted/30 hover:border-gold-deep pb-0.5 transition-colors focus-ring">
              Shop by category
            </a>
          </div>
        </div>
        <div className="relative hidden md:block h-[28rem] animate-floaty">
          <div className="absolute inset-0 rounded-[3rem] glass shadow-[0_30px_80px_-30px_rgba(58,52,46,0.35)] glass-sheen" />
          <div className="absolute inset-8 rounded-[2.4rem] bg-gradient-to-br from-blush via-cream to-gold-light/60" />
          <div className="absolute inset-8 rounded-[2.4rem] flex items-center justify-center">
            <Icon name="jewelry" className="w-24 h-24 text-porcelain/90" />
          </div>
        </div>
      </div>

      <div className="absolute bottom-0 left-0 right-0 text-cream">
        <WaveDivider />
      </div>
    </section>
  );
}

/* ============================================================================
   CATEGORIES
============================================================================ */
function Categories() {
  return (
    <section id="categories" className="bg-cream py-24 md:py-32">
      <div className="max-w-7xl mx-auto px-6 md:px-10">
        <div className="flex items-end justify-between mb-14 flex-wrap gap-4">
          <div>
            <p className="uppercase tracking-[0.3em] text-xs text-gold-deep mb-3">Shop by category</p>
            <h2 className="font-display text-4xl md:text-5xl text-ink">Six edits, one tide</h2>
          </div>
          <p className="text-ink-muted max-w-sm text-sm leading-relaxed">Every category is kept small on purpose — a considered handful of pieces rather than an endless scroll.</p>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-5 md:gap-6">
          {CATEGORIES.map((c, i) => (
            <CategoryCard key={c.key} cat={c} index={i} />
          ))}
        </div>
      </div>
    </section>
  );
}

function CategoryCard({ cat, index }) {
  const ref = useRef(null);
  useMousePosition(ref);
  return (
    <a
      ref={ref}
      href="#collection"
      className={
        "glass-sheen glass group relative rounded-3xl p-6 md:p-8 flex flex-col justify-between h-48 md:h-56 overflow-hidden focus-ring bg-gradient-to-br " +
        cat.tint +
        " hover:-translate-y-1.5 transition-transform duration-500 ease-out"
      }
      style={{ animationDelay: index * 60 + "ms" }}
    >
      <div className="w-11 h-11 rounded-full bg-porcelain/70 flex items-center justify-center text-gold-deep shadow-sm">
        <Icon name={cat.icon} className="w-5 h-5" />
      </div>
      <div>
        <h3 className="font-display text-xl md:text-2xl text-ink">{cat.key}</h3>
        <p className="text-xs text-ink-muted mt-1 tracking-wide">Discover the edit →</p>
      </div>
    </a>
  );
}

/* ============================================================================
   PRODUCTS
============================================================================ */
function money(n) {
  return "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 0 });
}

function ProductCard({ p }) {
  const ref = useRef(null);
  useMousePosition(ref);
  const hasDiscount = p.discountPrice != null && p.discountPrice !== "" && Number(p.discountPrice) < Number(p.price);
  return (
    <div ref={ref} className="glass-sheen glass group rounded-3xl overflow-hidden hover:-translate-y-2 transition-transform duration-500 ease-out">
      <div
        className="relative h-56 md:h-64 flex items-center justify-center overflow-hidden"
        style={ p.imageUrl ? {} : { background: "linear-gradient(135deg," + (p.from || "#EFDAD2") + "," + (p.to || "#B8935A") + ")" } }
      >
        {p.imageUrl ? (
          <img src={p.imageUrl} alt={p.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" />
        ) : (
          <Icon name={(CATEGORIES.find((c) => c.key === p.category) || {}).icon || "jewelry"} className="w-16 h-16 text-porcelain/85 group-hover:scale-110 transition-transform duration-700" />
        )}
        {hasDiscount && (
          <span className="absolute top-4 left-4 bg-porcelain/90 text-gold-deep text-[11px] tracking-wide px-3 py-1 rounded-full shadow-sm">Special edit</span>
        )}
      </div>
      <div className="p-5 md:p-6">
        <p className="text-[11px] uppercase tracking-[0.2em] text-ink-muted/80 mb-1">{p.category}</p>
        <h3 className="font-display text-lg text-ink mb-1">{p.name}</h3>
        <p className="text-sm text-ink-muted leading-relaxed mb-4 line-clamp-2">{p.description}</p>
        <div className="flex items-center justify-between">
          <div className="flex items-baseline gap-2">
            {hasDiscount ? (
              <>
                <span className="text-ink font-medium">{money(p.discountPrice)}</span>
                <span className="text-ink-muted/60 text-sm line-through">{money(p.price)}</span>
              </>
            ) : (
              <span className="text-ink font-medium">{money(p.price)}</span>
            )}
          </div>
          <button className="relative text-xs tracking-wide text-gold-deep group/btn focus-ring rounded">
            <span>Add to bag</span>
            <span className="absolute left-0 -bottom-1 w-0 group-hover/btn:w-full h-px bg-gold-deep transition-all duration-300" />
          </button>
        </div>
      </div>
    </div>
  );
}

function ProductGrid({ products, loading }) {
  const [activeCat, setActiveCat] = useState("All");
  const cats = ["All", ...CATEGORIES.map((c) => c.key)];
  const filtered = activeCat === "All" ? products : products.filter((p) => p.category === activeCat);

  return (
    <section id="collection" className="relative bg-blush/30 py-24 md:py-32">
      <div className="max-w-7xl mx-auto px-6 md:px-10">
        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-12">
          <div>
            <p className="uppercase tracking-[0.3em] text-xs text-gold-deep mb-3">The collection</p>
            <h2 className="font-display text-4xl md:text-5xl text-ink">Pieces, presently</h2>
          </div>
          <div className="flex gap-2 flex-wrap">
            {cats.map((c) => (
              <button
                key={c}
                onClick={() => setActiveCat(c)}
                className={
                  "px-4 py-2 rounded-full text-xs tracking-wide transition-colors focus-ring " +
                  (activeCat === c ? "bg-ink text-porcelain" : "glass text-ink-muted hover:text-ink")
                }
              >
                {c}
              </button>
            ))}
          </div>
        </div>

        {loading ? (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {[...Array(6)].map((_, i) => (
              <div key={i} className="rounded-3xl h-96 bg-mist/60 animate-pulse" />
            ))}
          </div>
        ) : filtered.length === 0 ? (
          <div className="text-center py-20 text-ink-muted">
            <p className="font-display text-2xl mb-2">Nothing in this edit yet.</p>
            <p className="text-sm">Add a product from the admin dashboard to see it appear here, live.</p>
          </div>
        ) : (
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {filtered.map((p) => (
              <ProductCard key={p.id} p={p} />
            ))}
          </div>
        )}
      </div>
      <div className="absolute -bottom-1 left-0 right-0 text-cream rotate-180">
        <WaveDivider />
      </div>
    </section>
  );
}

/* ============================================================================
   THE HOUSE (brand section) + FOOTER
============================================================================ */
function TheHouse() {
  return (
    <section id="the-house" className="bg-cream py-24 md:py-32">
      <div className="max-w-5xl mx-auto px-6 md:px-10 text-center">
        <p className="uppercase tracking-[0.3em] text-xs text-gold-deep mb-4">The house</p>
        <h2 className="font-display text-3xl md:text-5xl text-ink leading-snug mb-6">
          Named for the tide, because the best pieces feel <span className="italic text-gold-deep">inevitable</span> — not designed, but arrived at.
        </h2>
        <p className="text-ink-muted max-w-xl mx-auto leading-relaxed">
          Marée works with a small number of ateliers who cast, cut, and finish by hand. We hold a short list of pieces at a time, so every edit stays deliberate.
        </p>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer id="contact" className="relative bg-ink text-cream/80 pt-24 pb-10">
      <div className="absolute -top-1 left-0 right-0 text-ink">
        <WaveDivider />
      </div>
      <div className="max-w-7xl mx-auto px-6 md:px-10 grid md:grid-cols-3 gap-12">
        <div>
          <span className="font-display italic text-2xl text-cream">Marée</span>
          <p className="mt-4 text-sm leading-relaxed max-w-xs text-cream/60">A quiet, considered edit of fine accessories. Shaped like water finds its form.</p>
        </div>
        <div>
          <p className="text-xs uppercase tracking-[0.3em] text-gold-light mb-4">Stay informed</p>
          <p className="text-sm text-cream/60 mb-4 max-w-xs">New pieces, once in a while — never a flood.</p>
          <form onSubmit={(e) => e.preventDefault()} className="flex gap-2">
            <input
              type="email"
              required
              placeholder="you@email.com"
              className="flex-1 bg-porcelain/10 border border-cream/20 rounded-full px-4 py-2.5 text-sm placeholder:text-cream/40 focus-ring"
            />
            <button className="liquid-btn bg-gradient-to-br from-gold-light to-gold-deep text-ink px-5 py-2.5 rounded-full text-sm focus-ring">
              <span className="relative z-10">Join</span>
            </button>
          </form>
        </div>
        <div>
          <p className="text-xs uppercase tracking-[0.3em] text-gold-light mb-4">Visit</p>
          <ul className="space-y-2 text-sm text-cream/60">
            <li>Shipping and returns</li>
            <li>Care guide</li>
            <li>Private appointments</li>
          </ul>
        </div>
      </div>
      <div className="max-w-7xl mx-auto px-6 md:px-10 mt-16 pt-8 border-t border-cream/10 flex flex-col sm:flex-row justify-between gap-3 text-xs text-cream/40">
        <span>© {new Date().getFullYear()} Marée. All rights reserved.</span>
        <span>{USE_MOCK ? "Running in demo mode — connect Firebase to go live." : "Connected to Firebase."}</span>
      </div>
    </footer>
  );
}

/* ============================================================================
   ADMIN DASHBOARD
============================================================================ */
function AdminModal({ onClose }) {
  const [authed, setAuthed] = useState(false);
  useEffect(() => onAdminAuthChange(setAuthed), []);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-8">
      <div className="absolute inset-0 bg-ink/50 backdrop-blur-sm" onClick={onClose} />
      <div className="relative w-full max-w-3xl max-h-[88vh] overflow-y-auto scrollbar-none rounded-3xl glass shadow-[0_40px_100px_-30px_rgba(58,52,46,0.5)] bg-porcelain/90">
        <div className="sticky top-0 flex items-center justify-between px-6 md:px-8 py-5 border-b border-ink/5 bg-porcelain/90 backdrop-blur">
          <div className="flex items-center gap-3">
            <Icon name="gear" className="w-5 h-5 text-gold-deep" />
            <h2 className="font-display text-xl text-ink">Store dashboard</h2>
          </div>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-ink/5 text-ink-muted focus-ring" aria-label="Close dashboard">
            <Icon name="close" className="w-5 h-5" />
          </button>
        </div>
        <div className="p-6 md:p-8">
          {authed ? <AdminPanel /> : <AdminLogin />}
        </div>
      </div>
    </div>
  );
}

function AdminLogin() {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setError("");
    try {
      await adminSignIn(email, pass);
    } catch (err) {
      setError(err.message || "Couldn't sign in. Check your credentials.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <form onSubmit={submit} className="max-w-sm mx-auto py-6">
      <p className="text-center text-ink-muted text-sm mb-8 leading-relaxed">
        Sign in to add products, update prices, and manage discounts.
        {USE_MOCK && (
          <span className="block mt-2 text-xs text-gold-deep">Demo mode — passphrase is <code className="bg-blush/40 px-1.5 py-0.5 rounded">demo1234</code></span>
        )}
      </p>
      {!USE_MOCK && (
        <div className="mb-4">
          <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">Email</label>
          <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="owner@maree.com" className="w-full rounded-xl border border-ink/10 px-4 py-3 text-sm focus-ring" />
        </div>
      )}
      <div className="mb-6">
        <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">{USE_MOCK ? "Passphrase" : "Password"}</label>
        <input type="password" required value={pass} onChange={(e) => setPass(e.target.value)} placeholder="••••••••" className="w-full rounded-xl border border-ink/10 px-4 py-3 text-sm focus-ring" />
      </div>
      {error && <p className="text-xs text-red-600 mb-4">{error}</p>}
      <button disabled={busy} type="submit" className="liquid-btn w-full bg-gradient-to-br from-gold-light to-gold-deep text-porcelain py-3 rounded-full text-sm tracking-wide disabled:opacity-60 focus-ring">
        <span className="relative z-10">{busy ? "Signing in…" : "Sign in"}</span>
      </button>
    </form>
  );
}

const EMPTY_FORM = { name: "", category: CATEGORIES[0].key, price: "", discountPrice: "", description: "", imageUrl: "", from: "#EFDAD2", to: "#B8935A" };

function AdminPanel() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [form, setForm] = useState(EMPTY_FORM);
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const unsub = subscribeProducts((list) => { setProducts(list); setLoading(false); });
    return unsub;
  }, []);

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({
      name: p.name || "", category: p.category || CATEGORIES[0].key,
      price: p.price ?? "", discountPrice: p.discountPrice ?? "",
      description: p.description || "", imageUrl: p.imageUrl || "",
      from: p.from || "#EFDAD2", to: p.to || "#B8935A",
    });
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const resetForm = () => { setForm(EMPTY_FORM); setEditingId(null); };

  const submit = async (e) => {
    e.preventDefault();
    setSaving(true);
    try {
      await saveProduct({
        id: editingId,
        name: form.name.trim(),
        category: form.category,
        price: Number(form.price) || 0,
        discountPrice: form.discountPrice === "" ? null : Number(form.discountPrice),
        description: form.description.trim(),
        imageUrl: form.imageUrl.trim(),
        from: form.from,
        to: form.to,
      });
      resetForm();
    } finally {
      setSaving(false);
    }
  };

  const remove = async (id) => {
    if (confirm("Remove this product from the live store?")) await deleteProduct(id);
  };

  return (
    <div>
      <div className="flex items-center justify-between mb-6">
        <p className="text-sm text-ink-muted">{products.length} product{products.length === 1 ? "" : "s"} live · syncs in real time to every visitor</p>
        <button onClick={() => adminSignOut()} className="text-xs text-ink-muted hover:text-ink underline underline-offset-2 focus-ring rounded">Sign out</button>
      </div>

      <form onSubmit={submit} className="glass rounded-2xl p-5 md:p-6 mb-10 grid sm:grid-cols-2 gap-4">
        <div className="sm:col-span-2 flex items-center gap-2 mb-1">
          <Icon name={editingId ? "edit" : "plus"} className="w-4 h-4 text-gold-deep" />
          <h3 className="font-display text-lg text-ink">{editingId ? "Edit product" : "Add a new product"}</h3>
        </div>
        <div>
          <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">Name</label>
          <input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Tidal Drop Earrings" className="w-full rounded-xl border border-ink/10 px-3.5 py-2.5 text-sm focus-ring bg-porcelain" />
        </div>
        <div>
          <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">Category</label>
          <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} className="w-full rounded-xl border border-ink/10 px-3.5 py-2.5 text-sm focus-ring bg-porcelain">
            {CATEGORIES.map((c) => <option key={c.key} value={c.key}>{c.key}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">Price (USD)</label>
          <input required type="number" min="0" step="1" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} placeholder="240" className="w-full rounded-xl border border-ink/10 px-3.5 py-2.5 text-sm focus-ring bg-porcelain" />
        </div>
        <div>
          <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">Discount price (optional)</label>
          <input type="number" min="0" step="1" value={form.discountPrice} onChange={(e) => setForm({ ...form, discountPrice: e.target.value })} placeholder="Leave blank for none" className="w-full rounded-xl border border-ink/10 px-3.5 py-2.5 text-sm focus-ring bg-porcelain" />
        </div>
        <div className="sm:col-span-2">
          <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">Description</label>
          <textarea rows="2" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} placeholder="A short, considered line about the piece." className="w-full rounded-xl border border-ink/10 px-3.5 py-2.5 text-sm focus-ring bg-porcelain resize-none" />
        </div>
        <div className="sm:col-span-2">
          <label className="block text-xs uppercase tracking-wide text-ink-muted mb-1.5">Image URL (optional)</label>
          <input value={form.imageUrl} onChange={(e) => setForm({ ...form, imageUrl: e.target.value })} placeholder="https:// — leave blank to use a liquid-gradient placeholder" className="w-full rounded-xl border border-ink/10 px-3.5 py-2.5 text-sm focus-ring bg-porcelain" />
          <p className="text-[11px] text-ink-muted/70 mt-1">For real uploads, connect Firebase Storage and drop the resulting download URL here.</p>
        </div>
        <div className="sm:col-span-2 flex items-center gap-3 pt-2">
          <button disabled={saving} type="submit" className="liquid-btn bg-gradient-to-br from-gold-light to-gold-deep text-porcelain px-6 py-2.5 rounded-full text-sm focus-ring disabled:opacity-60">
            <span className="relative z-10">{saving ? "Saving…" : editingId ? "Save changes" : "Add product"}</span>
          </button>
          {editingId && (
            <button type="button" onClick={resetForm} className="text-sm text-ink-muted hover:text-ink focus-ring rounded">Cancel</button>
          )}
        </div>
      </form>

      <div className="space-y-2">
        {loading ? (
          <p className="text-sm text-ink-muted">Loading products…</p>
        ) : products.length === 0 ? (
          <p className="text-sm text-ink-muted">No products yet — add your first one above.</p>
        ) : (
          products.map((p) => (
            <div key={p.id} className="flex items-center gap-4 rounded-xl border border-ink/5 hover:border-gold-deep/30 px-4 py-3 transition-colors">
              <div
                className="w-11 h-11 rounded-lg flex-shrink-0"
                style={ p.imageUrl ? { backgroundImage: "url(" + p.imageUrl + ")", backgroundSize: "cover", backgroundPosition: "center" } : { background: "linear-gradient(135deg," + (p.from || "#EFDAD2") + "," + (p.to || "#B8935A") + ")" } }
              />
              <div className="flex-1 min-w-0">
                <p className="text-sm text-ink truncate">{p.name}</p>
                <p className="text-xs text-ink-muted">{p.category} · {money(p.discountPrice != null && p.discountPrice !== "" ? p.discountPrice : p.price)}{p.discountPrice != null && p.discountPrice !== "" && <span className="line-through ml-1 opacity-60">{money(p.price)}</span>}</p>
              </div>
              <button onClick={() => startEdit(p)} className="p-2 rounded-full hover:bg-blush/40 text-ink-muted hover:text-gold-deep focus-ring" aria-label={"Edit " + p.name}>
                <Icon name="edit" className="w-4 h-4" />
              </button>
              <button onClick={() => remove(p.id)} className="p-2 rounded-full hover:bg-red-50 text-ink-muted hover:text-red-500 focus-ring" aria-label={"Remove " + p.name}>
                <Icon name="trash" className="w-4 h-4" />
              </button>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

/* ============================================================================
   APP
============================================================================ */
function App() {
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [adminOpen, setAdminOpen] = useState(false);

  useEffect(() => {
    const unsub = subscribeProducts((list) => { setProducts(list); setLoading(false); });
    return unsub;
  }, []);

  return (
    <>
      <Header onOpenAdmin={() => setAdminOpen(true)} />
      <main>
        <Hero />
        <Categories />
        <ProductGrid products={products} loading={loading} />
        <TheHouse />
      </main>
      <Footer />
      {adminOpen && <AdminModal onClose={() => setAdminOpen(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
